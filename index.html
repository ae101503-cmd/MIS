<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資管系器材借用系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>資管系器材借用系統</h1>
    <p class="tagline">提供資管系師生借用教學與活動所需器材的一站式服務。</p>
  </header>

  <main class="container">
    <section>
      <h2>可借用器材類型</h2>
      <ul class="equipment-list">
        <li class="card">
          <h3>相機</h3>
          <p>適合活動紀錄、專題拍攝與課程影片製作。</p>
        </li>
        <li class="card">
          <h3>投影機</h3>
          <p>適合簡報展示、小組討論與教室外的場合使用。</p>
        </li>
        <li class="card">
          <h3>麥克風</h3>
          <p>適合演講、活動主持與錄音收音。</p>
        </li>
        <li class="card">
          <h3>腳架</h3>
          <p>適合穩定相機與手機，確保拍攝畫面不晃動。</p>
        </li>
      </ul>
    </section>

    <section>
      <h2>借用規則</h2>
      <ul class="rules-list">
        <li>每次最長可借用 7 天。</li>
        <li>請至系辦辦理借用與歸還手續。</li>
        <li>器材如有損壞，請務必告知系辦。</li>
        <li>逾期未還者，將停權一個月。</li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>線上查詢器材狀態功能即將推出</p>
  </footer>

  <script>
    // 之後的 JavaScript 寫在這裡
  </script>
</body>
</html>
